[platformio]
src_dir = ../examples/RndisMscWeb

[env:seeed-xiao-rp2040]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-rp2040
framework = arduino
test_build_src = false
lib_deps =
    file://../
    bblanchon/ArduinoJson
build_flags =
    -DUSE_TINYUSB
    -DCFG_TUD_NCM=1
    -DCFG_TUD_MSC=1
    -DCFG_TUD_CDC=1
    -DLWIP_HTTPD=1
    -DLWIP_HTTPD_CUSTOM_FILES=1
    -DLWIP_HTTPD_DYNAMIC_HEADERS=1
    -DLWIP_MDNS_RESPONDER=1
    -DLWIP_IGMP=1
    -DCFG_TUD_VENDOR=0
    -DLWIP_HTTPD_SUPPORT_POST=1
test_port = /dev/null
