name: Build Firmware

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build_platformio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio
      - name: Build
        run: pio run
        working-directory: platformio
      - name: Rename Artifact
        if: github.event_name == 'release'
        run: mv platformio/.pio/build/seeed-xiao-rp2040/firmware.uf2 firmware-platformio.uf2
      - name: Upload Release Asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: firmware-platformio.uf2

  build_arduino:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v1
      - name: Install dependencies
        run: |
          arduino-cli core update-index --additional-urls https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core install rp2040:rp2040 --additional-urls https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
      - name: Install Library
        run: |
          mkdir -p $HOME/Arduino/libraries
          ln -s $GITHUB_WORKSPACE $HOME/Arduino/libraries/xDuinoRails_DccCvMscWeb
      - name: Fix TinyUSB Headers
        run: |
          # Copy missing headers to the core library to allow compilation of RNDIS support
          # Find the library path (assuming standard installation)
          LIB_PATH=$(find /home/runner/.arduino15/packages/rp2040/hardware/rp2040 -name "Adafruit_TinyUSB_Arduino" | head -n 1)
          if [ -d "$LIB_PATH" ]; then
            echo "Found library at $LIB_PATH"
            # Copy to src/class/net/ (or wherever ecm_rndis_device.c is)
            # We look for ecm_rndis_device.c to be sure
            DEST_DIR=$(find "$LIB_PATH" -name ecm_rndis_device.c -exec dirname {} \;)
            echo "Destination dir: $DEST_DIR"
            cp src/rndis_protocol.h "$DEST_DIR/"
            cp src/ndis.h "$DEST_DIR/"
          else
            echo "Library not found!"
            exit 1
          fi
      - name: Compile
        run: |
          mkdir -p build_output
          arduino-cli compile --fqbn rp2040:rp2040:seeed_xiao_rp2040:usbstack=tinyusb,ipbtstack=ipv4only --build-property "build.extra_flags=-DCFG_TUD_ECM_RNDIS=1 -DCFG_TUD_NET_RNDIS=1 -DCFG_TUD_MSC=1 -DLWIP_HTTPD=1 -DLWIP_HTTPD_CUSTOM_FILES=1 -DLWIP_HTTPD_DYNAMIC_HEADERS=1" --output-dir build_output examples/RndisMscWeb
      - name: Rename Artifact
        if: github.event_name == 'release'
        run: mv build_output/RndisMscWeb.ino.uf2 firmware-arduino.uf2
      - name: Upload Release Asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: firmware-arduino.uf2
